# 反代规则 — 只 10388 对外
# /api/*  → api:8000
# /*      → web:80 (Vite dist 静态)

upstream pixelhoard_api {
    server api:8000;
}

upstream pixelhoard_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # API: /api/* → api:8000
    # 注意:转发时去掉 /api 前缀
    location /api/ {
        proxy_pass http://pixelhoard_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传支持(直传 OBS 后,这部分主要给 upload-init / complete 等小请求)
        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    # Guest routes: /s/{slug}/{token} → api:8000
    # 注:游客 URL 是路径式(ADR-0006),但 web SPA 也会用到 /s/:slug(React Router)
    # 这里只匹配 /s/{slug}/{token} 两段路径(slug+token),其他 /s/ 走 web
    location ~ "^/s/[^/]+/[^/]+/?$" {
        proxy_pass http://pixelhoard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload routes: /s/{slug}/upload-init 与 /upload-complete → api:8000
    # 三段路径,跟游客路径区别
    location ~ "^/s/[^/]+/upload-(init|complete)/?$" {
        proxy_pass http://pixelhoard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;  # init 端点小 body
    }

    # Web: 其他所有请求 → web:80
    location / {
        proxy_pass http://pixelhoard_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点(可选)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}