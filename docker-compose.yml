name: pixelhoard-api
services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelhoard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixelhoard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelhoard-dev-pass}
      POSTGRES_DB: ${POSTGRES_DB:-pixelhoard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixelhoard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不对外暴露端口 — 走容器网络
    networks:
      - pixelhoard-net

  redis:
    image: redis:7-alpine
    container_name: pixelhoard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pixelhoard-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pixelhoard-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixelhoard}:${POSTGRES_PASSWORD:-pixelhoard-dev-pass}@postgres:5432/${POSTGRES_DB:-pixelhoard}
      REDIS_URL: redis://redis:6379/0
      OBS_AK: ${OBS_AK}
      OBS_SK: ${OBS_SK}
      OBS_ENDPOINT: ${OBS_ENDPOINT}
      OBS_BUCKET: ${OBS_BUCKET}
      OBS_WORKDIR: ${OBS_WORKDIR:-PixelHoard}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-prod-32chars-min}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pixelhoard-net

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pixelhoard-worker
    restart: unless-stopped
    # worker 不需要 alembic(已跑过),只跑 worker 主循环
    command: ["python", "-m", "worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixelhoard}:${POSTGRES_PASSWORD:-pixelhoard-dev-pass}@postgres:5432/${POSTGRES_DB:-pixelhoard}
      REDIS_URL: redis://redis:6379/0
      OBS_AK: ${OBS_AK}
      OBS_SK: ${OBS_SK}
      OBS_ENDPOINT: ${OBS_ENDPOINT}
      OBS_BUCKET: ${OBS_BUCKET}
      OBS_WORKDIR: ${OBS_WORKDIR:-PixelHoard}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - pixelhoard-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: pixelhoard-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - pixelhoard-net

  nginx:
    image: nginx:1.27-alpine
    container_name: pixelhoard-nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-10388}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - pixelhoard-net

volumes:
  pgdata:
  redisdata:

networks:
  pixelhoard-net:
    driver: bridge