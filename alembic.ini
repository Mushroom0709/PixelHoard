# Alembic 配置 — ticket #3
# ticket #3: 在空 PG 上 alembic upgrade head 建 6 张表

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://pixelhoard:pixelhoard-dev-pass@postgres:5432/pixelhoard

# Override from env in env.py
# We don't put real secrets here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S